[package]
name = "venu"
version = "0.4.2"
edition = "2021"
description = "A sleek, hardware-accelerated Dynamic Notch for Windows with live background blur, media controls, multi-glass finishes, and desktop notifications."
license = "MIT"

[dependencies]
# wgpu backend instead of the default glow/OpenGL one. `default` pulls in
# `glow`, so it has to be switched off explicitly or both backends compile in.
# Everything else in the default set is kept.
eframe = { version = "0.34.3", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu",
    "wayland",
    "web_screen_reader",
    "x11",
] }
egui = "0.34.3"
# wgpu is not referenced anywhere in Venu's own source -- it is here to pin the
# backend, so it has to be a version egui-wgpu 0.34.3 actually compiles against.
# egui-wgpu resolves wgpu 29, but wgpu-hal 29 fails to build against the
# `windows` 0.62 bindings that accesskit-winit pulls in (Param/InterfaceType
# trait errors), so 30 is pinned instead. The dx12 backend stays off: it needs
# gpu-allocator, and Venu's Direct2D code is written against windows 0.58.
wgpu = { version = "30", default-features = false, features = [
    "vulkan",
    "wgsl",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
parking_lot = "0.12"

# Only used by the settings window, to build the wallpaper framing preview.
# The notch itself decodes through WIC.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "bmp",
    "gif",
    "webp",
] }

[dependencies.windows]
version = "0.58"
features = [
    "Foundation",
    "Foundation_Numerics",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
]

[build-dependencies]
# Embeds the version resource and app icon into venu.exe, so Explorer, the
# Start Menu and the installer can all see what they are looking at.
winresource = "0.1"
